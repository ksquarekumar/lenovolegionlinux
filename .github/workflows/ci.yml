name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete,cargo-deny
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - name: Install tools
        run: make tools
      # legionctl-system reads udev events through libudev and compiles its eBPF program with clang; legionctl-app
      # (GPUI) needs fontconfig, xkbcommon, xcb, wayland and vulkan headers; the daemon test
      # runs a private dbus-daemon; the session test runs bwrap
      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev dbus bubblewrap clang jq libfontconfig-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libvulkan-dev
      # plain-folder workspaces mount an overlay with bwrap >= 0.10; Ubuntu 24.04 has 0.9 (Arch has the current one)
      - name: bubblewrap 0.12.0
        run: |
          sudo apt-get install -y meson ninja-build libcap-dev
          curl -sLO https://github.com/containers/bubblewrap/releases/download/v0.12.0/bubblewrap-0.12.0.tar.xz
          echo "9760d007363e3abba7c747489910f9f82d9fca53ba3bd3282e396fa3c97a3314  bubblewrap-0.12.0.tar.xz" | sha256sum -c
          tar xJf bubblewrap-0.12.0.tar.xz
          meson setup bubblewrap-0.12.0/build bubblewrap-0.12.0 --prefix=/usr -Dman=disabled -Dtests=false -Dselinux=disabled
          sudo ninja -C bubblewrap-0.12.0/build install
          bwrap --version
      # the session test runs bwrap; Ubuntu blocks unprivileged user namespaces through AppArmor by default
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Lint, format check, profile validation, tests
        run: make ci
      # the eBPF sensors need root to load: run their tests with sudo (the binary is built as the runner user)
      - name: eBPF sensors as root
        run: |
          bin=$(cargo test -p legionctl --test machine --no-run --message-format=json \
            | jq -r 'select(.target.name == "machine" and .executable != null) | .executable')
          sudo -E "$bin" --ignored --exact operator_and_daemon::as_root_the_runq_sensor_measures_wakeups_and_outlives_a_failed_daemon \
            operator_and_daemon::as_root_the_exec_sensor_records_what_a_session_starts
      # sessions in a VM (W5): KVM for the runner user, QEMU, virtiofsd, xorriso for the cloud-init seed, and the
      # Debian cloud image the test downloads once (its SHA512SUMS beside it)
      - name: Cache the cloud image of the VM test
        uses: actions/cache@v4
        with:
          path: /var/tmp/legionctl-test-cache
          key: debian-13-genericcloud-v1
      - name: VM sessions
        run: |
          sudo apt-get install -y qemu-system-x86 qemu-utils virtiofsd xorriso
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          cargo test --locked -p legionctl --test e2e -- --ignored --exact \
            sessions_in_a_vm_work_on_the_shared_workspace_behind_the_git_gate
