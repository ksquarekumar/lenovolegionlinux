name: ci

on:
  push:
    # design notes alone change no behavior (docs/api/schema.json is checked by a test, so it is not here)
    paths-ignore: ["docs/design/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/design/**", "**/*.md"]

# a new push stops the run of the one before on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete,cargo-deny
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      # compiled dependencies (the workspace and the static client), keyed on Cargo.lock and the toolchain: only
      # legionctl's own crates compile again
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            . -> target/static
      - name: Install tools
        run: make tools
      # legionctl-system reads udev events through libudev and compiles its eBPF program with clang; legionctl-app
      # (GPUI) needs fontconfig, xkbcommon, xcb, wayland and vulkan headers; the daemon test
      # runs a private dbus-daemon; the session test runs bwrap
      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev dbus bubblewrap clang jq libarchive-tools libfontconfig-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libvulkan-dev
      # plain-folder workspaces mount an overlay with bwrap >= 0.10; Ubuntu 24.04 has 0.9 (Arch has the current one)
      - name: bubblewrap 0.12.0
        run: |
          sudo apt-get install -y meson ninja-build libcap-dev
          curl -sLO https://github.com/containers/bubblewrap/releases/download/v0.12.0/bubblewrap-0.12.0.tar.xz
          echo "9760d007363e3abba7c747489910f9f82d9fca53ba3bd3282e396fa3c97a3314  bubblewrap-0.12.0.tar.xz" | sha256sum -c
          tar xJf bubblewrap-0.12.0.tar.xz
          meson setup bubblewrap-0.12.0/build bubblewrap-0.12.0 --prefix=/usr -Dman=disabled -Dtests=false -Dselinux=disabled
          sudo ninja -C bubblewrap-0.12.0/build install
          bwrap --version
      # the session test runs bwrap; Ubuntu blocks unprivileged user namespaces through AppArmor by default
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Lint, format check, profile validation, tests
        run: make ci
      # the kernel style of legionctl-wmi with checkpatch of v7.2; the module builds in the VM step (DKMS, Debian's
      # 7.x kernel): the runner's kernel is older than the WMI API the module uses
      - name: Kernel module style
        run: |
          base=https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/scripts
          mkdir -p ~/checkpatch
          for f in checkpatch.pl spelling.txt const_structs.checkpatch; do curl -fsSL -o ~/checkpatch/$f "$base/$f?h=v7.2"; done
          (cd ~/checkpatch && sha256sum -c) <<'SUMS'
          f8f32e6b559004fcac021e2f6149b6b7ea486924a8bc48297c0f317eddf5e220  checkpatch.pl
          4095d4a8810f115bae1b7c0d8a1946beb3435f6e22d9a48ac009bb024bad1e68  spelling.txt
          ea064f6916a74763468037494aeb270aae34b7c97617e84d424ca5b8733539b2  const_structs.checkpatch
          SUMS
          make kmod-checkpatch CHECKPATCH="$HOME/checkpatch/checkpatch.pl"
      # the eBPF sensors need root to load: run their tests with sudo (the binary is built as the runner user)
      - name: eBPF sensors as root
        run: |
          bin=$(cargo test -p legionctl --test machine --no-run --message-format=json \
            | jq -r 'select(.target.name == "machine" and .executable != null) | .executable')
          sudo -E "$bin" --ignored --exact operator_and_daemon::as_root_the_runq_sensor_measures_wakeups_and_outlives_a_failed_daemon \
            operator_and_daemon::as_root_the_exec_sensor_records_what_a_session_starts \
            operator_and_daemon::as_root_the_workload_sensor_applies_a_layer_while_a_build_runs \
            operator_and_daemon::as_root_the_power_sensor_finds_a_busy_loop \
            operator_and_daemon::as_root_the_block_sensor_counts_the_writes_of_a_dd \
            operator_and_daemon::as_root_a_session_file_open_reaches_only_its_owner \
            operator_and_daemon::as_root_the_windows_vm_starts_with_its_disk_and_gives_the_host_back
      # sessions in a VM (W5) and the legionctl-wmi module in a VM: KVM for the runner user, QEMU, virtiofsd, xorriso
      # for the cloud-init seed, the Debian cloud image the tests download once (its SHA512SUMS beside it) and the
      # disk the module test makes once over it (Debian's generic 7.x kernel, its headers, DKMS); iasl compiles the stand-in firmware
      - name: Cache the disks of the VM tests
        uses: actions/cache@v4
        with:
          path: /var/tmp/legionctl-test-cache
          key: debian-13-genericcloud-v2-legionctl-wmi-base-v1
      # read-only shares need virtiofsd --readonly (1.11 and newer); Ubuntu 24.04 has 1.10: built once, then cached
      - name: Cache virtiofsd
        id: virtiofsd
        uses: actions/cache@v4
        with:
          path: ~/virtiofsd-bin
          key: virtiofsd-1.14.0-${{ runner.os }}
      - name: VM sessions
        run: |
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso acpica-tools libcap-ng-dev libseccomp-dev
          if [ ! -x ~/virtiofsd-bin/virtiofsd ]; then
            cargo install --locked --root ~/virtiofsd-root virtiofsd@1.14.0
            mkdir -p ~/virtiofsd-bin && cp ~/virtiofsd-root/bin/virtiofsd ~/virtiofsd-bin/
          fi
          sudo install -m 755 ~/virtiofsd-bin/virtiofsd /usr/libexec/virtiofsd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          cargo test --locked -p legionctl --test e2e -- --ignored --exact \
            sessions_in_a_vm_work_on_the_shared_workspace_behind_the_git_gate \
            the_legionctl_wmi_module_gives_the_legion_wmi_through_sysfs
