name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete,cargo-deny
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - name: Install tools
        run: make tools
      # legionctl-system reads udev events through libudev; the daemon test runs a private dbus-daemon
      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev dbus
      - name: Lint, format check, profile validation, tests
        run: make ci
