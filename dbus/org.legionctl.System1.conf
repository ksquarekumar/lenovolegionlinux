<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- only root (legionctl-system) may own the name -->
  <policy user="root">
    <allow own="org.legionctl.System1"/>
  </policy>
  <!-- anyone may call it and receive its signals; polkit decides per method -->
  <policy context="default">
    <allow send_destination="org.legionctl.System1"/>
  </policy>
</busconfig>
