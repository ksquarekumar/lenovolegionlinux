# Tool configuration only: legionctl is a single-file script, not an installable package.

[tool.ruff]
line-length = 130
target-version = "py313"
extend-include = ["src/legionctl/legionctl"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
scripts_are_modules = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# PyGObject ships no stubs in the isolated mypy env; gi is a system package
module = ["gi", "gi.*"]
ignore_missing_imports = true
