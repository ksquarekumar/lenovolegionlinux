<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- legionctl's greeter reads only these fonts (FONTCONFIG_FILE in its greetd command): with every system font, its
     start parsed each font file first (1543 faces, 2.4 GB here) and showed the login about 3 s later -->
<fontconfig>
  <dir>/usr/share/legionctl/greeter/fonts</dir>
  <alias><family>sans-serif</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Noto Sans Mono</family></prefer></alias>
</fontconfig>
