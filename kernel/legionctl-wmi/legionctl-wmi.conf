# legionctl-wmi owns the Legion WMI of the 82WQ and gives the same platform_profile and
# lenovo-wmi-other-0 firmware attributes. The package installs this file to /usr/share/legionctl only:
# it goes to /etc/modprobe.d after the user's first live load of the module (docs/design/08-kernel.md),
# so an untested module never replaces the upstream drivers by itself at the next start.
blacklist lenovo_wmi_gamezone
blacklist lenovo_wmi_other
blacklist lenovo_wmi_capdata
blacklist lenovo_wmi_events
blacklist lenovo_wmi_hotkey_utilities
