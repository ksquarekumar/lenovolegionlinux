# The opt-in to legionctl_wmi: it owns the Legion WMI of the 82WQ and gives the same platform_profile and
# lenovo-wmi-other-0 firmware attributes. The package installs this file to /usr/share/legionctl only. After the
# user's first live load of the module (docs/design/08-kernel.md), the user installs it as
# /etc/modprobe.d/legionctl-wmi.conf. That name replaces the package's /usr/lib/modprobe.d/legionctl-wmi.conf
# (modprobe.d(5)), which blacklists legionctl_wmi: then udev loads legionctl_wmi and not the upstream drivers.
blacklist lenovo_wmi_gamezone
blacklist lenovo_wmi_other
blacklist lenovo_wmi_capdata
blacklist lenovo_wmi_events
blacklist lenovo_wmi_hotkey_utilities
