# The package installs this file to /usr/lib/modprobe.d/legionctl-wmi.conf. legionctl_wmi has the modalias of each
# Legion WMI GUID; without this line udev loads it at start beside the upstream lenovo_wmi_* drivers, and the two
# bind different devices (no platform_profile, incident of 2026-10-16). A blacklist stops only the load by alias:
# `modprobe legionctl_wmi` still loads it. The opt-in file /etc/modprobe.d/legionctl-wmi.conf has the same name and
# replaces this file (modprobe.d(5)); see docs/design/08-kernel.md, First live load.
blacklist legionctl_wmi
