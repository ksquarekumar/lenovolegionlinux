[package]
name = "legionctl-operator"
description = "The user's legionctl engine: the operation registry on a socket-activated unix socket, and the session module (Fn+R, OSD)"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
legionctl-api = { path = "../legionctl-api" }
legionctl-core = { path = "../legionctl-core" }
legionctl-machine = { path = "../legionctl-machine" }
sd-notify = "0.5.0"
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
futures-util = "0.3.34"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }

[lints]
workspace = true
