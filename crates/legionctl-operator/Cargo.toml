[package]
name = "legionctl-operator"
description = "The user-session operator: Fn+R refresh toggle through Mutter and OSD requests to the GNOME Shell extension"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
tokio = { version = "1.53.2", features = ["macros", "rt", "signal"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
futures-util = "0.3.34"
