[package]
name = "legionctl-app"
description = "The legionctl desktop app (GPUI): the machine at a glance, GPU wiring, health, bench and tuning"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
legionctl-api = { path = "../legionctl-api", features = ["client", "cli"] }
legionctl-core = { path = "../legionctl-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
zbus = { version = "5.19.0", default-features = false, features = ["tokio", "p2p"] }
gpui-kit = { version = "=0.7.3", features = ["gpui-fast"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
