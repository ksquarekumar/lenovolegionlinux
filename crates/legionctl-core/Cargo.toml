[package]
name = "legionctl-core"
description = "State, load, worktree and action primitives shared by the legionctl CLI, app and MCP server"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
legionctl-machine = { path = "../legionctl-machine" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
toml.workspace = true
json_comments = "0.2.2"
blake2 = "0.10.6"
# wait4: the CPU, memory and IO profile of a check run (design 23, E2 rule 5)
libc = "0.2.190"
rustix = { version = "1.1.5", features = ["fs"] }
rusqlite.workspace = true
toml_edit = "0.25.15"
similar = "3.2.0"
# test functions, their spans and assertions for the test gate (design 23, A7)
syn = { version = "2.0.119", features = ["full", "visit"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"

[lints]
workspace = true
