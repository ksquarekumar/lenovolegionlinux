[package]
name = "legionctl"
description = "CLI, TUI and MCP server of legionctl: clients of legionctl-operator"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
legionctl-api = { path = "../legionctl-api", features = ["client", "cli"] }
legionctl-core = { path = "../legionctl-core" }
legionctl-machine = { path = "../legionctl-machine" }
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4.6.7", features = ["string"] }
ratatui = "0.30.2"
rmcp = { version = "3.5.1", features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
http = "1.3.1"
blake2 = "0.10.6"
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "io-std", "io-util", "process", "signal"] }

[dev-dependencies]
legionctl-app = { path = "../legionctl-app" }
gpui-kit = { version = "=0.7.3", features = ["gpui-fast", "test-support"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
futures-util = "0.3.34"
rustix = { version = "1.1.5", features = ["fs", "process"] }
toml.workspace = true
rusqlite.workspace = true

[lints]
workspace = true
