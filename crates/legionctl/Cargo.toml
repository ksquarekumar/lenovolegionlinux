[package]
name = "legionctl"
description = "CLI, TUI and MCP server of legionctl: clients of legionctl-operator"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
legionctl-api = { path = "../legionctl-api" }
legionctl-machine = { path = "../legionctl-machine" }
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4.6.7", features = ["string"] }
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
ratatui = "0.30.2"
rmcp = { version = "3.5.1", features = ["server", "transport-io"] }
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "io-std"] }

[lints]
workspace = true
