[package]
name = "legionctl"
description = "CLI, TUI and MCP server of legionctl: clients of legionctl-operator"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
legionctl-api = { path = "../legionctl-api", features = ["client"] }
legionctl-machine = { path = "../legionctl-machine" }
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4.6.7", features = ["string"] }
ratatui = "0.30.2"
rmcp = { version = "3.5.1", features = ["server", "client", "transport-io", "transport-child-process"] }
blake2 = "0.10.6"
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "io-std", "process"] }

[dev-dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
futures-util = "0.3.34"

[lints]
workspace = true
