[workspace]
members = ["crates/legionctl-core", "crates/legionctl-machine", "crates/legionctl"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.2.0"

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.2"
toml = "1.1.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
