[workspace]
members = ["crates/legionctl-core", "crates/legionctl-machine", "crates/legionctl-api", "crates/legionctl-system", "crates/legionctl-operator", "crates/legionctl", "crates/legionctl-app"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
schemars = "1.2.2"
toml = "1.1.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }

# The build of each test command (`--profile test-fast`); the package and the static client use release. Measured on
# 2026-10-15 (32 CPUs, sccache, jobs 6): a one-line edit in legionctl-core builds the workspace and its tests again in
# 15 s (release 84 s, dev 46 s), and the full suite runs in 81-84 s (release 85-107 s).
[profile.test-fast]
inherits = "release"
opt-level = 1
codegen-units = 256
incremental = true

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
