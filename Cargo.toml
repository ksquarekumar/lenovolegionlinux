[workspace]
members = ["crates/legionctl-core", "crates/legionctl-machine", "crates/legionctl-system", "crates/legionctl-operator", "crates/legionctl"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
schemars = "1.2.2"
toml = "1.1.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
